apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: dev-

namespace: overleaf-dev

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment

configMapGenerator:
  - name: overleaf-config
    behavior: merge
    literals:
      - OVERLEAF_SITE_URL=http://localhost:8080
      - NODE_ENV=development
      - LOG_LEVEL=debug
