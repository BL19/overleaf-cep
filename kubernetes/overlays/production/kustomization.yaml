apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

namePrefix: prod-

namespace: overleaf-prod

patches:
  - patch: |-
      - op: replace
        path: /data/OVERLEAF_SITE_URL
        value: "https://overleaf.example.com"
      - op: replace
        path: /data/NODE_ENV
        value: "production"
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"
    target:
      kind: ConfigMap
      name: overleaf-config

replicas:
  - name: overleaf-web
    count: 2
  - name: overleaf-real-time
    count: 2
  - name: overleaf-clsi
    count: 3
  - name: overleaf-document-updater
    count: 2
