apiVersion: v1
kind: Secret
metadata:
  name: {{ include "overleaf.fullname" . }}-secrets
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
type: Opaque
stringData:
  OVERLEAF_SESSION_SECRET: {{ .Values.overleaf.sessionSecret | default (randAlphaNum 64) | quote }}
  WEB_API_USER: {{ .Values.overleaf.webApiUser | quote }}
  WEB_API_PASSWORD: {{ .Values.overleaf.webApiPassword | default (randAlphaNum 32) | quote }}
  {{- if .Values.sandbox.enabled }}
  # Shared secret for CLSI to sandbox-agent authentication
  SANDBOX_AGENT_SECRET: {{ .Values.sandbox.agentSecret | default (randAlphaNum 64) | quote }}
  {{- end }}
  {{- if .Values.overleaf.email.enabled }}
  OVERLEAF_EMAIL_FROM_ADDRESS: {{ .Values.overleaf.email.fromAddress | quote }}
  OVERLEAF_EMAIL_REPLY_TO: {{ .Values.overleaf.email.replyTo | quote }}
  OVERLEAF_EMAIL_SMTP_HOST: {{ .Values.overleaf.email.smtp.host | quote }}
  OVERLEAF_EMAIL_SMTP_PORT: {{ .Values.overleaf.email.smtp.port | quote }}
  OVERLEAF_EMAIL_SMTP_SECURE: {{ .Values.overleaf.email.smtp.secure | quote }}
  OVERLEAF_EMAIL_SMTP_USER: {{ .Values.overleaf.email.smtp.user | quote }}
  OVERLEAF_EMAIL_SMTP_PASS: {{ .Values.overleaf.email.smtp.password | quote }}
  {{- end }}
  {{- if eq .Values.filestore.backend "s3" }}
  OVERLEAF_FILESTORE_S3_ACCESS_KEY_ID: {{ .Values.filestore.s3.accessKeyId | quote }}
  OVERLEAF_FILESTORE_S3_SECRET_ACCESS_KEY: {{ .Values.filestore.s3.secretAccessKey | quote }}
  {{- end }}
