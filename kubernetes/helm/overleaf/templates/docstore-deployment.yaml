{{- if .Values.docstore.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "overleaf.fullname" . }}-docstore
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: docstore
spec:
  replicas: {{ .Values.docstore.replicaCount }}
  selector:
    matchLabels:
      {{- include "overleaf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: docstore
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "overleaf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: docstore
    spec:
      {{- include "overleaf.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "overleaf.serviceAccountName" . }}
      containers:
        - name: docstore
          image: {{ include "overleaf.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node"]
          args: ["--expose-gc", "/overleaf/services/docstore/app.js"]
          ports:
            - name: http
              containerPort: {{ .Values.docstore.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "overleaf.fullname" . }}-config
            - secretRef:
                name: {{ include "overleaf.fullname" . }}-secrets
          env:
            - name: LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.docstore.port | quote }}
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.docstore.resources | nindent 12 }}
      {{- with .Values.docstore.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.docstore.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.docstore.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "overleaf.fullname" . }}-docstore
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: docstore
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.docstore.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "overleaf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: docstore
{{- end }}
