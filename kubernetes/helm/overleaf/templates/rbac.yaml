{{- if and .Values.rbac.create .Values.sandbox.enabled }}
---
# Role for managing sandbox pods in the sandbox namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "overleaf.fullname" . }}-sandbox-manager
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
---
# RoleBinding for CLSI service to manage sandbox pods
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "overleaf.fullname" . }}-sandbox-manager
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "overleaf.fullname" . }}-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "overleaf.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
