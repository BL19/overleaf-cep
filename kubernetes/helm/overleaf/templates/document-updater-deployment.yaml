{{- if .Values.documentUpdater.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "overleaf.fullname" . }}-document-updater
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-updater
spec:
  replicas: {{ .Values.documentUpdater.replicaCount }}
  selector:
    matchLabels:
      {{- include "overleaf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: document-updater
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "overleaf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: document-updater
    spec:
      {{- include "overleaf.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "overleaf.serviceAccountName" . }}
      containers:
        - name: document-updater
          image: {{ include "overleaf.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node"]
          args: ["--expose-gc", "/overleaf/services/document-updater/app.js"]
          ports:
            - name: http
              containerPort: {{ .Values.documentUpdater.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "overleaf.fullname" . }}-config
            - secretRef:
                name: {{ include "overleaf.fullname" . }}-secrets
          env:
            - name: LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.documentUpdater.port | quote }}
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.documentUpdater.resources | nindent 12 }}
      {{- with .Values.documentUpdater.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.documentUpdater.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.documentUpdater.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "overleaf.fullname" . }}-document-updater
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-updater
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.documentUpdater.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "overleaf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: document-updater
{{- end }}
