{{- if .Values.filestore.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "overleaf.fullname" . }}-filestore
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: filestore
spec:
  replicas: {{ .Values.filestore.replicaCount }}
  selector:
    matchLabels:
      {{- include "overleaf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: filestore
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "overleaf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: filestore
    spec:
      {{- include "overleaf.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "overleaf.serviceAccountName" . }}
      containers:
        - name: filestore
          image: {{ include "overleaf.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node"]
          args: ["--expose-gc", "/overleaf/services/filestore/app.js"]
          ports:
            - name: http
              containerPort: {{ .Values.filestore.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "overleaf.fullname" . }}-config
            - secretRef:
                name: {{ include "overleaf.fullname" . }}-secrets
          env:
            - name: LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.filestore.port | quote }}
            {{- if eq .Values.filestore.backend "s3" }}
            - name: OVERLEAF_FILESTORE_S3_ENDPOINT
              value: {{ .Values.filestore.s3.endpoint | quote }}
            - name: OVERLEAF_FILESTORE_S3_REGION
              value: {{ .Values.filestore.s3.region | quote }}
            - name: OVERLEAF_FILESTORE_S3_PATH_STYLE
              value: {{ .Values.filestore.s3.pathStyle | quote }}
            - name: OVERLEAF_FILESTORE_TEMPLATE_FILES_BUCKET_NAME
              value: {{ .Values.filestore.s3.buckets.templateFiles | quote }}
            - name: OVERLEAF_HISTORY_PROJECT_BLOBS_BUCKET
              value: {{ .Values.filestore.s3.buckets.projectBlobs | quote }}
            - name: OVERLEAF_HISTORY_BLOBS_BUCKET
              value: {{ .Values.filestore.s3.buckets.globalBlobs | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.filestore.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/overleaf/data
            - name: templates
              mountPath: /var/lib/overleaf/data/template_files
            - name: history
              mountPath: /var/lib/overleaf/data/history
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "overleaf.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: templates
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "overleaf.fullname" . }}-templates
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: history
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "overleaf.fullname" . }}-history
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.filestore.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.filestore.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.filestore.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "overleaf.fullname" . }}-filestore
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: filestore
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.filestore.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "overleaf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: filestore
{{- end }}
