apiVersion: apps/v1
kind: Deployment
metadata:
  name: overleaf-web
  namespace: overleaf
  labels:
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: overleaf
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overleaf
        app.kubernetes.io/component: web
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: web
          image: sharelatex/sharelatex:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: overleaf-config
          env:
            - name: LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: WEB_PORT
              value: "3000"
            - name: ENABLED_SERVICES
              value: "web,api"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: overleaf-secrets
                  key: mongodb-url
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: overleaf-secrets
                  key: redis-password
                  optional: true
            - name: OVERLEAF_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: overleaf-secrets
                  key: session-secret
            - name: WEB_API_USER
              valueFrom:
                secretKeyRef:
                  name: overleaf-secrets
                  key: web-api-user
            - name: WEB_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: overleaf-secrets
                  key: web-api-password
          livenessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/overleaf/data
            - name: uploads
              mountPath: /var/lib/overleaf/tmp/uploads
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: overleaf-data
        - name: uploads
          persistentVolumeClaim:
            claimName: overleaf-uploads
