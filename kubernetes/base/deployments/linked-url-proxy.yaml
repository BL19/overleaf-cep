apiVersion: apps/v1
kind: Deployment
metadata:
  name: overleaf-linked-url-proxy
  namespace: overleaf
  labels:
    app.kubernetes.io/component: linked-url-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: overleaf
      app.kubernetes.io/component: linked-url-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: overleaf
        app.kubernetes.io/component: linked-url-proxy
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: linked-url-proxy
          image: sharelatex/sharelatex:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "--expose-gc", "/overleaf/services/linked-url-proxy/app.mjs"]
          ports:
            - name: http
              containerPort: 3066
              protocol: TCP
          envFrom:
            - configMapRef:
                name: overleaf-config
          env:
            - name: LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: PORT
              value: "3066"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: overleaf-secrets
                  key: mongodb-url
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: overleaf-secrets
                  key: redis-password
                  optional: true
          livenessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
