apiVersion: v1
kind: Secret
metadata:
  name: overleaf-secrets
  namespace: overleaf
type: Opaque
stringData:
  # MongoDB connection URL (update for your MongoDB instance)
  mongodb-url: "mongodb://overleaf:overleaf-password@mongodb:27017/sharelatex?replicaSet=rs0"
  
  # Redis password (if authentication is enabled)
  redis-password: ""
  
  # IMPORTANT: Session secret - MUST be changed in production!
  # Generate with: openssl rand -hex 32
  # This is a placeholder value - DO NOT use in production!
  session-secret: "CHANGE_ME_TO_A_RANDOM_SECRET_STRING"
  
  # IMPORTANT: Web API credentials for inter-service communication
  # These MUST be changed in production!
  # Generate password with: openssl rand -hex 32
  web-api-user: "overleaf"
  web-api-password: "CHANGE_ME_INTERNAL_API_PASSWORD"
