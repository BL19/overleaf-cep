apiVersion: v1
kind: Secret
metadata:
  name: overleaf-secrets
  namespace: overleaf
type: Opaque
stringData:
  # MongoDB connection URL (update for your MongoDB instance)
  mongodb-url: "mongodb://overleaf:overleaf-password@mongodb:27017/sharelatex?replicaSet=rs0"
  
  # Redis password (if authentication is enabled)
  redis-password: ""
  
  # Session secret - IMPORTANT: Generate a unique secret!
  # You can generate one with: openssl rand -hex 32
  session-secret: "change-me-to-a-random-secret-string"
  
  # Web API credentials for inter-service communication
  web-api-user: "overleaf"
  web-api-password: "internal-api-password-change-me"
