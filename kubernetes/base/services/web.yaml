apiVersion: v1
kind: Service
metadata:
  name: overleaf-web
  namespace: overleaf
  labels:
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: overleaf
    app.kubernetes.io/component: web
