apiVersion: v1
kind: Service
metadata:
  name: overleaf-linked-url-proxy
  namespace: overleaf
  labels:
    app.kubernetes.io/component: linked-url-proxy
spec:
  type: ClusterIP
  ports:
    - port: 3066
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: overleaf
    app.kubernetes.io/component: linked-url-proxy
