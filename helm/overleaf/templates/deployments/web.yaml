{{- if .Values.services.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "overleaf.fullname" . }}-web
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.services.web.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "overleaf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets/secrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "overleaf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "overleaf.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "overleaf.imageName" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.web.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "overleaf.fullname" . }}-config
          env:
            {{- include "overleaf.commonEnv" . | nindent 12 }}
            {{- include "overleaf.serviceDiscoveryEnv" . | nindent 12 }}
            - name: LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: WEB_PORT
              value: {{ .Values.services.web.port | quote }}
            - name: ENABLED_SERVICES
              value: "web,api"
            - name: OVERLEAF_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "overleaf.fullname" . }}-secrets
                  key: session-secret
            - name: WEB_API_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "overleaf.fullname" . }}-secrets
                  key: web-api-user
            - name: WEB_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "overleaf.fullname" . }}-secrets
                  key: web-api-password
            {{- if eq .Values.overleaf.filestoreBackend "s3" }}
            - name: OVERLEAF_FILESTORE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "overleaf.fullname" . }}-secrets
                  key: s3-access-key-id
            - name: OVERLEAF_FILESTORE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "overleaf.fullname" . }}-secrets
                  key: s3-secret-access-key
            {{- end }}
            {{- if .Values.overleaf.email.enabled }}
            - name: OVERLEAF_EMAIL_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "overleaf.fullname" . }}-secrets
                  key: smtp-password
            {{- end }}
            {{- with .Values.services.web.env }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.healthCheck.enabled }}
          livenessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.healthCheck.livenessProbe.successThreshold }}
          readinessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.healthCheck.readinessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.services.web.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/overleaf/data
            - name: uploads
              mountPath: /var/lib/overleaf/tmp/uploads
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "overleaf.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: uploads
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "overleaf.fullname" . }}-uploads
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
