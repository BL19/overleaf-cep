{{- if .Values.services.clsi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "overleaf.fullname" . }}-clsi
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: clsi
spec:
  replicas: {{ .Values.services.clsi.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "overleaf.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clsi
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secrets/secrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "overleaf.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clsi
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "overleaf.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: clsi
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "overleaf.imageName" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "--expose-gc", "/overleaf/services/clsi/app.js"]
          ports:
            - name: http
              containerPort: {{ .Values.services.clsi.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "overleaf.fullname" . }}-config
          env:
            {{- include "overleaf.commonEnv" . | nindent 12 }}
            {{- include "overleaf.serviceDiscoveryEnv" . | nindent 12 }}
            - name: LISTEN_ADDRESS
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.services.clsi.port | quote }}
            - name: COMPILE_TIMEOUT
              value: {{ .Values.overleaf.compileTimeout | quote }}
            {{- if .Values.services.clsi.texLiveImage }}
            - name: TEX_LIVE_DOCKER_IMAGE
              value: {{ .Values.services.clsi.texLiveImage | quote }}
            {{- end }}
            {{- with .Values.services.clsi.env }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- if .Values.healthCheck.enabled }}
          livenessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.healthCheck.livenessProbe.successThreshold }}
          readinessProbe:
            httpGet:
              path: /health_check
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.healthCheck.readinessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.services.clsi.resources | nindent 12 }}
          volumeMounts:
            - name: compiles
              mountPath: /var/lib/overleaf/data/compiles
            - name: cache
              mountPath: /var/lib/overleaf/data/cache
            - name: output
              mountPath: /var/lib/overleaf/data/output
      volumes:
        - name: compiles
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "overleaf.fullname" . }}-compiles
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: cache
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "overleaf.fullname" . }}-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: output
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
