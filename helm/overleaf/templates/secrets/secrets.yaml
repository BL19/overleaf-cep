apiVersion: v1
kind: Secret
metadata:
  name: {{ include "overleaf.fullname" . }}-secrets
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.mongodb.external.enabled }}
  mongodb-url: {{ .Values.mongodb.external.url | quote }}
  {{- else if .Values.mongodb.enabled }}
  mongodb-url: {{ include "overleaf.mongodbUrl" . | quote }}
  {{- end }}
  {{- if .Values.redis.auth.enabled }}
  redis-password: {{ .Values.redis.auth.password | quote }}
  {{- else if .Values.redis.external.password }}
  redis-password: {{ .Values.redis.external.password | quote }}
  {{- end }}
  {{- if .Values.overleaf.sessionSecret }}
  session-secret: {{ .Values.overleaf.sessionSecret | quote }}
  {{- else }}
  session-secret: {{ randAlphaNum 64 | quote }}
  {{- end }}
  {{- if .Values.overleaf.email.enabled }}
  smtp-password: {{ .Values.overleaf.email.smtp.password | quote }}
  {{- end }}
  {{- if eq .Values.overleaf.filestoreBackend "s3" }}
  s3-access-key-id: {{ .Values.overleaf.s3.accessKeyId | quote }}
  s3-secret-access-key: {{ .Values.overleaf.s3.secretAccessKey | quote }}
  {{- end }}
  # Web API credentials for inter-service communication
  web-api-user: "overleaf"
  web-api-password: {{ randAlphaNum 32 | quote }}
