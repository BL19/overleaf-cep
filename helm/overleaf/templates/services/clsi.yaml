{{- if .Values.services.clsi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "overleaf.fullname" . }}-clsi
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: clsi
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.clsi.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "overleaf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clsi
{{- end }}
