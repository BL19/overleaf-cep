{{- if .Values.services.filestore.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "overleaf.fullname" . }}-filestore
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: filestore
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.filestore.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "overleaf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: filestore
{{- end }}
