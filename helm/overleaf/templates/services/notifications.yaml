{{- if .Values.services.notifications.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "overleaf.fullname" . }}-notifications
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: notifications
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.notifications.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "overleaf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: notifications
{{- end }}
