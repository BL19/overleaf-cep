{{- if .Values.services.linkedUrlProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "overleaf.fullname" . }}-linked-url-proxy
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
    app.kubernetes.io/component: linked-url-proxy
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.linkedUrlProxy.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "overleaf.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: linked-url-proxy
{{- end }}
