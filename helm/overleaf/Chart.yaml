apiVersion: v2
name: overleaf
description: A Helm chart for deploying Overleaf Community Edition as microservices on Kubernetes
type: application
version: 1.0.0
appVersion: "5.0.0"
keywords:
  - overleaf
  - latex
  - collaborative-editing
  - document-editor
home: https://github.com/overleaf/overleaf
sources:
  - https://github.com/overleaf/overleaf
maintainers:
  - name: Overleaf Community
dependencies:
  - name: mongodb
    version: "14.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: mongodb.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
